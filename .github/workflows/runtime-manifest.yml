name: runtime-manifest

# 版本号是归档字节的函数，而归档是构建产物、不入库：clean checkout 上这个 job
# 只会打印“跳过校验”。真正的门禁在打包机上执行
# `node scripts/runtime-manifest.mjs check`（或 build.mjs --release）。
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 来源：https://api.github.com/repos/actions/checkout/git/ref/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 来源：https://api.github.com/repos/actions/setup-node/git/ref/tags/v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Check runtime manifest
        run: |
          # 归档是构建产物、不入库：clean checkout 上脚本会打印“跳过校验”并以 0 退出。
          # 真正的门禁在打包机上：node scripts/runtime-manifest.mjs check
          node scripts/runtime-manifest.mjs check
