name: runtime-manifest

# 运行时归档（official-engine.tar.gz / npm.tar.gz 等）是构建产物，被 .gitignore
# 排除，clean checkout 里永远没有。这个 job 只能校验工作区里已有归档的构建机，
# 因此在 tag push（发布）时不触发；发布前请在打包机上本地执行
# `node scripts/runtime-manifest.mjs check`。
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 来源：https://api.github.com/repos/actions/checkout/git/ref/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 来源：https://api.github.com/repos/actions/setup-node/git/ref/tags/v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Check runtime manifest
        run: |
          TOOLS=entry/src/main/resources/rawfile/tools
          missing=0
          for f in official-engine.tar.gz official-engine.sha256 npm.tar.gz python-stdlib.tar vim-runtime.tar.gz; do
            [ -f "$TOOLS/$f" ] || { echo "::warning::缺少运行时归档 $f（构建产物不入库，需在打包机上校验）"; missing=1; }
          done
          if [ "$missing" -eq 1 ]; then
            # 归档是构建产物：clean checkout / CI 不可能带上，标注后跳过。
            # 发布门禁在打包机上执行 `node scripts/runtime-manifest.mjs check`。
            echo "::warning::缺少运行时归档（构建产物不入库），跳过清单校验；发布前在打包机执行 npm run runtime:check"
            exit 0
          fi
          node scripts/runtime-manifest.mjs check
