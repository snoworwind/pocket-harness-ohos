name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # action 固定到 commit SHA，避免可变的 @v4 标签被替换。
      # 来源：https://api.github.com/repos/actions/checkout/git/ref/tags/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # 来源：https://api.github.com/repos/actions/setup-node/git/ref/tags/v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Scan tracked files for secrets
        run: node .githooks/secret-scan.mjs --all
      - name: Scan history and commit messages
        env:
          SECRET_SCAN_HISTORY_LIMIT: 500
        run: node .githooks/secret-scan.mjs --history
