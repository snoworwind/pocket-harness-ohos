<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>keyboard probe</title>
<style>
  html, body { margin: 0; height: 100%; background: #101113; color: #e8eaed; }
  .wrap { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; padding: 24px; }
  .spacer { flex: 1; }
  .box { background: #1b1d21; border-radius: 16px; padding: 16px; }
  input { width: 100%; box-sizing: border-box; background: #26282d; color: #e8eaed;
          border: 0; border-radius: 10px; padding: 14px; font-size: 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <h2>键盘闪白探针</h2>
    <div class="spacer"></div>
    <div class="box"><input id="probe" placeholder="点这里拉起软键盘" /></div>
  </div>
</body>
</html>
